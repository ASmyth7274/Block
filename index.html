<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; outline: none; }
  #gl { z-index: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #gui { z-index: 1; }
  #textinput { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; z-index: -1; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; color: #fff;
    font: bold 20px monospace; letter-spacing: 2px; text-shadow: 2px 2px #3f3f3f; background: #2b1d14; }
  #splash small { margin-top: 12px; font-size: 13px; color: #b0b0b0; letter-spacing: 1px; }
  #fatal { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 6; color: #fff; background: #2b1d14; font: 16px monospace; text-align: center; padding: 24px; box-sizing: border-box; }
  #fatal .detail { margin-top: 12px; color: #a0a0a0; font-size: 12px; }
</style>
